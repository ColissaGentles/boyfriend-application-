<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boyfriend Application 💌</title>
<style>
:root{--bg:#fff0f5;--card:#fff;--ink:#3a1f2b;--muted:#8a6475;--pink:#e84a86;--line:#f3c6d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1118;--card:#2c1a24;--ink:#fbe8f0;--muted:#c79bb0;--pink:#ff6fa3;--line:#5a3347}}
:root[data-theme="dark"]{--bg:#1e1118;--card:#2c1a24;--ink:#fbe8f0;--muted:#c79bb0;--pink:#ff6fa3;--line:#5a3347}
html{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:2rem;text-align:center;margin:0 0 6px;color:var(--pink)}
.sub{text-align:center;color:var(--muted);margin:0 0 26px;font-style:italic}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:bold;margin-bottom:8px}
label span{color:var(--pink);margin-right:6px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--pink)}
button{width:100%;font:inherit;font-weight:bold;border:0;border-radius:999px;padding:14px;margin-top:8px;cursor:pointer}
.go{background:var(--pink);color:#fff;font-size:1.1rem}
.alt{background:transparent;color:var(--pink);border:1px solid var(--pink)}
#msg{text-align:center;color:var(--muted);min-height:1.4em;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>Boyfriend Application 💌</h1>
<p class="sub">Think you’ve got what it takes? Answer honestly. I can tell when you don’t.</p>
<div id="qs"></div>
<button class="go" id="send">Submit my application 💘</button>
<button class="alt" id="copy">Copy my answers instead</button>
<div id="msg"></div>
</main>
<script>
// SET THESE: where applications get sent
var PHONE = "";   // her phone number, e.g. +15551234567
var EMAIL = "gcolissa@gmail.com";   // optional email fallback

var QUESTIONS = [
 ["Your name and age","input"],
 ["Describe yourself in three words (then what would your best friend say?)","text"],
 ["What’s your idea of a perfect first date?","text"],
 ["What’s your love language, and how do you actually show it?","text"],
 ["We have a disagreement. Walk me through what you do.","text"],
 ["What’s your biggest green flag and your biggest red flag?","text"],
 ["What are you really looking for in a relationship?","text"],
 ["Where do you see us in a year?","text"],
 ["Why should I pick you over everyone else?","text"],
 ["Anything else I should know?","text"]
];
var box=document.getElementById("qs");
QUESTIONS.forEach(function(q,i){
 var d=document.createElement("div");d.className="q";
 var l=document.createElement("label");l.htmlFor="q"+i;
 var n=document.createElement("span");n.textContent=(i+1)+".";
 l.appendChild(n);l.appendChild(document.createTextNode(q[0]));
 var f=document.createElement(q[1]==="input"?"input":"textarea");f.id="q"+i;
 d.appendChild(l);d.appendChild(f);box.appendChild(d);
});
function build(){
 var out="💌 BOYFRIEND APPLICATION 💌\n\n";
 QUESTIONS.forEach(function(q,i){
  out+=(i+1)+". "+q[0]+"\n"+(document.getElementById("q"+i).value.trim()||"(no answer)")+"\n\n";
 });
 return out;
}
function ok(){
 if(!document.getElementById("q0").value.trim()){
  document.getElementById("msg").textContent="Please at least tell me your name 😉";return false;}
 return true;
}
document.getElementById("send").onclick=function(){
 if(!ok())return;
 var body=encodeURIComponent(build());
 document.getElementById("msg").textContent="Opening your messages… hit send to finish! 💘";
 if(PHONE){location.href="sms:"+PHONE+"?&body="+body;}
 else if(EMAIL){location.href="mailto:"+EMAIL+"?subject="+encodeURIComponent("Boyfriend Application")+"&body="+body;}
 else{document.getElementById("msg").textContent="Sending isn’t set up yet. Use “Copy my answers” instead.";}
};
document.getElementById("copy").onclick=function(){
 if(!ok())return;
 var t=build(),m=document.getElementById("msg");
 try{navigator.clipboard.writeText(t).then(function(){m.textContent="Copied! Paste it into a message to me 💕";},function(){m.textContent="Couldn’t copy. Select and copy your answers manually.";});}
 catch(e){m.textContent="Couldn’t copy. Select and copy your answers manually.";}
};
</script>
</body>
</html>
